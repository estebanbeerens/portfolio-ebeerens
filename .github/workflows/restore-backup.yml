name: Restore backup
run-name: Restore ${{ inputs.backup_key != '' && inputs.backup_key || 'latest backup' }}

on:
  workflow_dispatch:
    inputs:
      backup_key:
        description: 'R2 object key to restore, or leave blank to use the newest backup'
        required: false
        default: ''

jobs:
  resolve-backup:
    name: Resolve backup object from R2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backup_file: ${{ steps.backup.outputs.backup_file }}

    steps:
      - name: Resolve backup object
        id: backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
          R2_JURISDICTION: ${{ secrets.R2_JURISDICTION }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.backup_key }}" ]]; then
            echo "backup_file=${{ inputs.backup_key }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${R2_JURISDICTION:-}" ]]; then
            r2_endpoint="https://${R2_ACCOUNT_ID}.${R2_JURISDICTION}.r2.cloudflarestorage.com"
          else
            r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi

          backup_file="$(aws --endpoint-url "${r2_endpoint}" s3 ls "s3://${R2_BACKUPS_BUCKET}/" --recursive | sort | tail -n 1 | awk '{print $4}')"

          if [[ -z "$backup_file" ]]; then
            echo "No backups found in s3://${R2_BACKUPS_BUCKET}/" >&2
            exit 1
          fi

          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"

  restore:
    name: Restore selected backup into a disposable database
    needs: resolve-backup
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download, restore and verify backup
        uses: appleboy/ssh-action@v1
        env:
          BACKUP_KEY: ${{ needs.resolve-backup.outputs.backup_file }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
          R2_JURISDICTION: ${{ secrets.R2_JURISDICTION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.ADMIN_USER }}
          key: ${{ secrets.ADMIN_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: BACKUP_KEY,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_ACCOUNT_ID,R2_BACKUPS_BUCKET,R2_JURISDICTION
          script: |
            set -euo pipefail

            db_name='portfolio_restore_test'
            db_user='restoreuser'
            db_password="$(openssl rand -hex 24)"
            work_dir='/tmp/portfolio-restore'

            cleanup() {
              docker rm -f "$db_name" >/dev/null 2>&1 || true
              rm -rf "$work_dir"
            }
            trap cleanup EXIT

            export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            export AWS_DEFAULT_REGION='auto'
            export AWS_EC2_METADATA_DISABLED='true'

            if [ -n "${R2_JURISDICTION:-}" ]; then
              r2_endpoint="https://${R2_ACCOUNT_ID}.${R2_JURISDICTION}.r2.cloudflarestorage.com"
            else
              r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            fi

            rm -rf "$work_dir"
            mkdir -p "$work_dir"
            backup_path="${work_dir}/$(basename "$BACKUP_KEY")"

            echo "Downloading s3://${R2_BACKUPS_BUCKET}/${BACKUP_KEY}"
            aws --endpoint-url "${r2_endpoint}" \
              s3 cp "s3://${R2_BACKUPS_BUCKET}/${BACKUP_KEY}" "$backup_path"

            echo "Starting disposable Postgres"
            docker rm -f "$db_name" >/dev/null 2>&1 || true
            docker run -d --rm \
              --name "$db_name" \
              -e POSTGRES_USER="$db_user" \
              -e POSTGRES_PASSWORD="$db_password" \
              -e POSTGRES_DB="$db_name" \
              -p 5434:5432 \
              postgres:16-alpine

            echo "Waiting for Postgres to accept connections"
            for _ in $(seq 1 30); do
              if docker exec "$db_name" pg_isready -U "$db_user" -d "$db_name" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            docker exec "$db_name" pg_isready -U "$db_user" -d "$db_name"

            echo "Restoring backup"
            export DATABASE_URL="postgresql://${db_user}:${db_password}@localhost:5434/${db_name}"
            /opt/portfolio/deploy/restore-backup.sh "$backup_path"

            echo "Verifying restored database"
            psql "$DATABASE_URL" -c '\dt'

      - name: Summary
        if: always()
        run: |
          echo "## Restore check" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved backup: ${{ needs.resolve-backup.outputs.backup_file }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary database: portfolio_restore_test" >> "$GITHUB_STEP_SUMMARY"
