name: Database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * 0'

jobs:
  backup:
    name: Run production Postgres backup
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger server-side backup script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.ADMIN_USER }}
          key: ${{ secrets.ADMIN_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            set -a
            source /opt/portfolio/.env
            set +a

            echo "Running production backup..."
            /opt/deploy/backup-db.sh

            # backup-db.sh exports AWS_* only within its own process, so re-export
            # them here for this listing step.
            export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION="auto"
            export AWS_EC2_METADATA_DISABLED=true

            if [[ -n "${R2_JURISDICTION:-}" ]]; then
              r2_endpoint="https://${R2_ACCOUNT_ID}.${R2_JURISDICTION}.r2.cloudflarestorage.com"
            else
              r2_endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            fi

            echo "Recent backup objects:"
            aws --endpoint-url "${r2_endpoint}" \
              s3 ls "s3://${R2_BACKUPS_BUCKET}/" --recursive | tail -n 20 || echo "Warning: could not list bucket objects (check R2 token permissions)."

      - name: Summary
        if: always()
        run: |
          echo "## Backup run" >> "$GITHUB_STEP_SUMMARY"
          echo "Backup workflow completed for the production VPS." >> "$GITHUB_STEP_SUMMARY"
