<svg class="size-4 shrink-0" [lucideIcon]="icon()" aria-hidden="true"></svg>
<span class="min-w-0 flex-1"><ng-content /></span>
@if (badge(); as badge) {
  @if (badge > 0) {
    <span
      class="bg-accent text-neutral-0 shrink-0 rounded-full px-1.5 py-0.5 text-xs font-semibold dark:text-neutral-950"
      >{{ badge }}</span
    >
  }
}
@if (active()) {
  <span class="bg-accent h-4 w-1 shrink-0 rounded-xs" aria-hidden="true"></span>
}
