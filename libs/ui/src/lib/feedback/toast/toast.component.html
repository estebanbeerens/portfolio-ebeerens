<div class="pointer-events-none fixed right-4 bottom-4 z-50 flex flex-col gap-2" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="bg-surface pointer-events-auto flex items-center gap-3 rounded-md border px-4 py-3 text-sm shadow-xl transition-all duration-200 starting:translate-y-2 starting:opacity-0"
      [class]="
        toast.leaving
          ? 'translate-y-2 opacity-0 ' + variantClass(toast.variant)
          : 'translate-y-0 opacity-100 ' + variantClass(toast.variant)
      "
      [attr.role]="toast.variant === 'error' ? 'alert' : 'status'"
    >
      <span class="text-text">{{ toast.message }}</span>
      <button
        type="button"
        class="text-text-muted hover:text-text active:text-text focus-visible:outline-accent ml-auto inline-flex size-11 shrink-0 cursor-pointer items-center justify-center focus-visible:outline-2 focus-visible:outline-offset-2"
        aria-label="Dismiss notification"
        (click)="toastService.dismiss(toast.id)"
      >
        &times;
      </button>
    </div>
  }
</div>
