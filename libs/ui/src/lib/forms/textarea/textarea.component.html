<ui-form-field [label]="label()" [for]="controlId()" [hint]="hint()" [error]="error()" [required]="required()">
  <textarea
    [id]="controlId()"
    class="border-border bg-surface hover:border-border-strong focus-visible:outline-accent mt-1 min-h-24 w-full rounded border px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [attr.maxlength]="maxlength() ?? null"
    [required]="required()"
    [disabled]="disabled()"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-describedby]="error() ? controlId() + '-error' : hint() ? controlId() + '-hint' : null"
    [value]="value()"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
  ></textarea>
</ui-form-field>
