<div
  class="ui-segmented-control"
  role="tablist"
  [attr.aria-label]="label()"
  [style.--ui-segmented-count]="options().length"
  [style.--ui-segmented-index]="selectedIndex()"
>
  <span class="ui-segmented-control-indicator" aria-hidden="true"></span>

  @for (option of options(); track option.value) {
    <button
      type="button"
      class="ui-segmented-control-tab"
      role="tab"
      [attr.aria-selected]="selected() === option.value"
      [attr.aria-controls]="option.panelId"
      [disabled]="option.disabled"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
