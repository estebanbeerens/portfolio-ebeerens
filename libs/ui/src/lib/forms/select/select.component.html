<ui-form-field [label]="label()" [for]="controlId()" [hint]="hint()" [error]="error()" [required]="required()">
  <select
    [id]="controlId()"
    class="border-border bg-surface hover:border-border-strong focus-visible:outline-accent mt-1 w-full cursor-pointer rounded border px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2"
    [required]="required()"
    [disabled]="disabled()"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-describedby]="error() ? controlId() + '-error' : hint() ? controlId() + '-hint' : null"
    (change)="onSelect($any($event.target).value)"
    (blur)="onBlur()"
  >
    @if (placeholder()) {
      <option value="" disabled [selected]="value() === ''">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
</ui-form-field>
