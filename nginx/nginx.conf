worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Hashed build assets (js/css/fonts/images) are safe to request in bursts and must not be
  # rate-limited like dynamic HTML/API traffic: a single cold-cache page load fetches many of them
  # at once from one client IP, and a 503 from the limiter can get cached by Cloudflare under an
  # asset URL. An empty limit key makes nginx skip the limit, so asset requests are keyed to "".
  map $uri $limit_req_key {
    default $binary_remote_addr;
    ~*\.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|webmanifest|txt|xml)$ '';
  }

  limit_req_zone $limit_req_key zone=perip:10m rate=10r/s;

  # Docker's embedded DNS (127.0.0.11) re-resolves service names on every deploy when a container
  # is recreated with a new internal IP. Without this, nginx resolves proxy_pass hostnames once at
  # startup and caches that IP forever, leaving it pointing at a dead IP until nginx itself restarts.
  # ipv6=off: Docker DNS returns AAAA records too, but the compose network is IPv4-only, so leaving
  # it on makes nginx attempt (and log errors for) unusable IPv6 upstreams.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Cloudflare proxies all traffic, so $remote_addr is normally one of Cloudflare's edge IPs, not
  # the real visitor - that breaks per-IP rate limiting (many visitors share a handful of edge IPs)
  # and would leak the wrong IP downstream. Trust Cloudflare's published ranges and read the real
  # client IP from CF-Connecting-IP. The trust list is generated from https://www.cloudflare.com/ips-v4
  # and /ips-v6 by deploy/update-cloudflare-ips.sh (run on deploy) so it never drifts out of date.
  include /etc/nginx/cloudflare-real-ip.conf;
  real_ip_header CF-Connecting-IP;

  # Security headers are declared once here so they apply to every server/location. nginx's
  # add_header is replace-not-merge per context: if a location ever adds its own add_header, these
  # would be silently dropped for that location - keeping them centralized avoids that trap (there
  # are deliberately no location-level add_header directives below).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Stage 10 is HTTP-only. Stage 11 adds `listen 443 ssl` + the Cloudflare Origin CA
  # cert/key under ./nginx/certs once Cloudflare/DNS/TLS are wired up.

  # Public site
  server {
    listen 80 default_server;
    server_name ebeerens.com www.ebeerens.com _;

    limit_req zone=perip burst=20 nodelay;

    location /api/ {
      # No trailing URI on proxy_pass: with a resolver-backed variable upstream, appending a URI
      # here corrupts the path forwarded upstream (nginx can't do location-prefix replacement
      # against a variable) - omitting it passes the original request URI through untouched, which
      # is what we want since this prefix matches the api app's own '/api' global prefix.
      set $upstream_api api:3000;
      proxy_pass http://$upstream_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward-compatible redirect for old admin URLs.
    location ~ ^/admin(?:/|$)(.*)$ {
      return 301 $scheme://admin.ebeerens.com/$1$is_args$args;
    }

    location / {
      set $upstream_web web:4000;
      proxy_pass http://$upstream_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Admin site
  server {
    listen 80;
    server_name admin.ebeerens.com;

    limit_req zone=perip burst=20 nodelay;

    location /api/ {
      set $upstream_api api:3000;
      proxy_pass http://$upstream_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $upstream_admin admin:4000;
      proxy_pass http://$upstream_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

}
