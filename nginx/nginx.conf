worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

  # Docker's embedded DNS (127.0.0.11) re-resolves service names on every deploy when a container
  # is recreated with a new internal IP. Without this, nginx resolves proxy_pass hostnames once at
  # startup and caches that IP forever, leaving it pointing at a dead IP until nginx itself restarts.
  resolver 127.0.0.11 valid=10s;

  # Cloudflare proxies all traffic, so $remote_addr is normally one of Cloudflare's edge IPs, not
  # the real visitor - that breaks per-IP rate limiting (many visitors share a handful of edge IPs)
  # and would leak the wrong IP downstream. Trust Cloudflare's published ranges and read the real
  # client IP from CF-Connecting-IP. https://www.cloudflare.com/ips/ (update if Cloudflare changes these).
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Stage 10 is HTTP-only. Stage 11 adds `listen 443 ssl` + the Cloudflare Origin CA
  # cert/key under ./nginx/certs once Cloudflare/DNS/TLS are wired up.

  # Public site
  server {
    listen 80 default_server;
    server_name ebeerens.com www.ebeerens.com _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req zone=perip burst=20 nodelay;

    location /api/ {
      # No trailing URI on proxy_pass: with a resolver-backed variable upstream, appending a URI
      # here corrupts the path forwarded upstream (nginx can't do location-prefix replacement
      # against a variable) - omitting it passes the original request URI through untouched, which
      # is what we want since this prefix matches the api app's own '/api' global prefix.
      set $upstream_api api:3000;
      proxy_pass http://$upstream_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward-compatible redirect for old admin URLs.
    location ~ ^/admin(?:/|$)(.*)$ {
      return 301 $scheme://admin.ebeerens.com/$1$is_args$args;
    }

    location / {
      set $upstream_web web:4000;
      proxy_pass http://$upstream_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Admin site
  server {
    listen 80;
    server_name admin.ebeerens.com;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req zone=perip burst=20 nodelay;

    location /api/ {
      set $upstream_api api:3000;
      proxy_pass http://$upstream_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $upstream_admin admin:4000;
      proxy_pass http://$upstream_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

}
