worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

  # Stage 10 is HTTP-only. Stage 11 adds `listen 443 ssl` + the Cloudflare Origin CA
  # cert/key under ./nginx/certs once Cloudflare/DNS/TLS are wired up.

  # Public site
  server {
    listen 80 default_server;
    server_name ebeerens.com www.ebeerens.com _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req zone=perip burst=20 nodelay;

    location /api/ {
      proxy_pass http://api:3000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backward-compatible redirect for old admin URLs.
    location ~ ^/admin(?:/|$)(.*)$ {
      return 301 $scheme://admin.ebeerens.com/$1$is_args$args;
    }

    location / {
      proxy_pass http://web:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Admin site
  server {
    listen 80;
    server_name admin.ebeerens.com;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_req zone=perip burst=20 nodelay;

    location /api/ {
      proxy_pass http://api:3000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://admin:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

}
