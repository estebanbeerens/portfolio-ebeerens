<section class="grid items-center gap-10 lg:grid-cols-[minmax(0,1fr)_26rem] lg:gap-12" aria-labelledby="hero-title">
  <div class="flex flex-col items-start gap-6">
    <h1
      id="hero-title"
      class="font-display text-text max-w-4xl text-5xl leading-[1.05] font-extrabold sm:text-6xl lg:text-6xl"
      i18n="@@hero.title"
    >
      Crafting fluid <span class="text-accent">interactive</span> architectures
    </h1>
    @if (profile()?.bioHtml; as bioHtml) {
      <div class="text-text-muted max-w-3xl text-base leading-7 sm:leading-8" [innerHTML]="bioHtml"></div>
    }
    <div class="flex flex-wrap gap-4">
      <a uiButton routerLink="/projects" i18n="@@hero.seeProjects">See My Projects</a>
      <a uiButton variant="outlined" routerLink="/contact" i18n="@@hero.getInTouch">Get In Touch</a>
    </div>
  </div>

  <web-basic-info-card [profile]="profile()" />
</section>
