<div
  #content
  class="text-text-muted mt-3 text-sm whitespace-pre-line"
  [class.line-clamp-2]="!expanded()"
  [attr.data-expanded]="expanded()"
>
  {{ description() }}
</div>
@if (overflows() && !expanded()) {
  <button
    type="button"
    class="text-text-muted hover:text-text focus-visible:outline-accent mt-1 cursor-pointer text-sm underline underline-offset-2 focus-visible:outline-2 focus-visible:outline-offset-2"
    [attr.aria-label]="'Show full description for ' + roleTitle()"
    (click)="expand()"
    i18n="@@roleDescription.readMore"
  >
    Read more
  </button>
}
