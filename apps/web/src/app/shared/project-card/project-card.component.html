<a class="project-card-link" [routerLink]="['/projects', project().slug]">
  <ui-card
    density="compact"
    class="shadow-elevation hover:bg-glass-hover active:bg-glass-active h-full transition-colors"
  >
    @if (project().imageUrl; as imageUrl) {
      <div class="relative h-44 w-full overflow-hidden rounded-md">
        <img
          [ngSrc]="imageUrl"
          [ngSrcset]="imageNgSrcset"
          sizes="(min-width: 1024px) 320px, (min-width: 640px) 45vw, 90vw"
          fill
          class="object-cover"
          [alt]="project().title + ' project preview'"
        />
      </div>
    } @else {
      <div
        class="h-44 w-full rounded-md bg-linear-to-r to-transparent opacity-90"
        [class.from-cyan-500]="isCyanTone()"
        [class.from-violet-500]="!isCyanTone()"
        aria-hidden="true"
      ></div>
    }
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between gap-4">
        <h3 class="font-display text-text text-xl font-bold">{{ project().title }}</h3>
        <p class="text-text-subtle shrink-0 font-mono text-xs">{{ projectYear(project()) }}</p>
      </div>
      <p class="text-text-muted line-clamp-3 text-sm leading-6">{{ project().shortDescription }}</p>
      <p class="dark:text-accent truncate font-mono text-xs text-cyan-900">{{ skillSummary(project()) }}</p>
    </div>
  </ui-card>
</a>
