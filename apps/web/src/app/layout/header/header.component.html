<header class="border-border-subtle bg-overlay backdrop-blur-glass border-b">
  <nav
    class="mx-auto flex w-full max-w-7xl items-center justify-between gap-6 px-6 py-4 lg:px-10"
    aria-label="Primary navigation"
    i18n-aria-label="@@header.nav.ariaLabel"
  >
    <a
      class="focus-visible:outline-accent text-text flex min-h-11 items-center gap-2 rounded-sm no-underline focus-visible:outline-2 focus-visible:outline-offset-4"
      routerLink="/"
    >
      <span class="bg-accent size-3 rounded-full shadow-[0_0_24px_rgb(56_189_248_/_0.8)]" aria-hidden="true"></span>
      @if (profile()?.name; as name) {
        <span class="font-display text-xl font-bold tracking-normal">{{ name }}</span>
      }
    </a>

    <div class="flex items-center gap-2 sm:gap-6">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        i18n="@@header.nav.home"
        >Home</a
      >
      @if (content.projectsEnabled()) {
        <a class="nav-link" routerLink="/projects" routerLinkActive="nav-link-active" i18n="@@header.nav.projects"
          >Projects</a
        >
      }
      @if (content.resumeEnabled()) {
        <a class="nav-link" routerLink="/resume" routerLinkActive="nav-link-active" i18n="@@header.nav.resume"
          >Resume</a
        >
      }
      @if (content.contactEnabled()) {
        <a class="nav-link" routerLink="/contact" routerLinkActive="nav-link-active" i18n="@@header.nav.contact"
          >Contact</a
        >
      }
      <ui-theme-toggle />
    </div>
  </nav>
</header>
