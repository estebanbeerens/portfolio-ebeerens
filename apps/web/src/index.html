<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home | Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Esteban Beerens: software projects, professional experience, resume, and contact information."
    />
    <meta name="theme-color" content="#111827" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="logo-light.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Matches --color-bg-value from libs/ui/src/theme/tokens.css. Paints the correct theme
         background before the stylesheet loads, so there's no flash of the browser's default
         white background while navigating in (especially noticeable in dark mode). */
      html,
      body {
        background-color: #ffffff;
      }
      html.dark,
      html.dark body {
        background-color: #08071a;
      }
    </style>
    <script>
      // Set the theme class before first paint/hydration to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.getElementById('app-favicon').href = isDark ? 'logo-dark.svg' : 'logo-light.svg';
        } catch (e) {
          // localStorage may be unavailable (e.g. private browsing); default to light.
        }
      })();
    </script>
  </head>
  <body>
    <web-root></web-root>
  </body>
</html>
