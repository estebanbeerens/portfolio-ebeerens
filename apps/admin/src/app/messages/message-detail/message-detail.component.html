@if (message(); as message) {
  <ui-card class="min-w-0 flex-1 xl:sticky xl:top-6 xl:max-h-[calc(100dvh-14.5rem)]" density="comfortable">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="min-w-0">
        <h2 class="font-display text-lg font-semibold">{{ message.subject }}</h2>
        <p class="text-text-muted mt-1 text-sm">
          {{ message.fullName }}
          @if (message.organization) {
            · {{ message.organization }}
          }
        </p>
        <a class="text-accent text-sm break-all" [href]="'mailto:' + message.email">{{ message.email }}</a>
        <p class="text-text-muted mt-1 text-xs">{{ message.createdAt | date: 'medium' }}</p>
      </div>
      <div class="flex shrink-0 gap-2">
        <a uiButton variant="outlined" [href]="gmailComposeUrl()" target="_blank" rel="noopener noreferrer">
          Reply in Gmail
        </a>
        <button uiButton variant="outlined" type="button" (click)="toggleRead.emit()">
          {{ message.isRead ? 'Mark as unread' : 'Mark as read' }}
        </button>
        <button uiButton variant="outlined" tone="danger" type="button" (click)="delete.emit()">Delete</button>
      </div>
    </div>

    <p class="text-text scrollbar-subtle mt-6 -mr-2 min-h-0 flex-1 overflow-y-auto pr-2 whitespace-pre-wrap">
      {{ message.message }}
    </p>
  </ui-card>
} @else {
  <ui-card class="flex min-w-0 flex-1 items-center justify-center" density="comfortable">
    <p class="text-text-muted">Select a message to read it.</p>
  </ui-card>
}
