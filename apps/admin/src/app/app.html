<main class="center-screen">
  @switch (authState()) {
    @case ('checking') {
      <p>Checking session…</p>
    }
    @case ('loggedOut') {
      @if (unauthorized) {
        <p class="error-message">
          This GitHub account isn't authorized to access this admin panel.
        </p>
      }
      <a class="login-button" href="/api/auth/github">Log in with GitHub</a>
    }
    @case ('authenticated') {
      <p>Logged in as {{ githubUserId() }}</p>
      <button type="button" (click)="logout()">Log out</button>
    }
  }
</main>
