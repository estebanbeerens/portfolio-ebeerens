<ui-page-header title="Projects" subtitle="Portfolio artifacts and featured work." />

<div class="flex flex-col gap-6 transition-all duration-300 xl:flex-row">
  <admin-project-list
    [projects]="projectList()"
    [loading]="projects.isLoading()"
    [error]="requestError()"
    (create)="beginCreate()"
    (edit)="beginEdit($event)"
    (delete)="askToDelete($event)"
    (retry)="retry()"
  />

  @if (formOpen()) {
    <admin-project-form
      [project]="selectedProject()"
      [skillOptions]="skillOptions()"
      [saving]="isSaving()"
      [formError]="formError()"
      [resetToken]="formResetToken()"
      (saved)="save($event)"
      (cancelled)="cancelEdit()"
    />
  }
</div>

<admin-project-delete-dialog
  [project]="pendingDelete()"
  [deleting]="isDeleting()"
  (confirm)="deleteProject()"
  (dismiss)="cancelDelete()"
/>
