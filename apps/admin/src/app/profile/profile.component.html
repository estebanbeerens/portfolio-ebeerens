<ui-page-header title="Basic Info" subtitle="Your public identity and profile biography." />

@if (requestError(); as error) {
  <div class="border-error bg-surface flex items-center justify-between gap-4 border p-4" role="alert">
    <p class="text-sm">{{ error }}</p>
    <button
      type="button"
      class="text-accent focus-visible:outline-accent focus-visible:outline-2 focus-visible:outline-offset-2"
      (click)="retry()"
    >
      Retry
    </button>
  </div>
}

@if (isLoading()) {
  <p class="text-text-muted" role="status">Loading Basic Info...</p>
}

<div class="flex flex-col gap-6 xl:flex-row xl:items-start">
  <admin-profile-form
    class="min-w-0 flex-2"
    [profile]="profile()"
    [saving]="saving()"
    [formError]="formError()"
    (saved)="save($event)"
  />

  <section class="w-full space-y-4 xl:max-w-sm" aria-labelledby="cv-preview-title">
    <h2 id="cv-preview-title" class="font-display text-text text-xl font-semibold">CV preview</h2>
    <ui-language-tabs label="CV language" panelId="cv-preview-panel" [(language)]="previewLocale" />
    <div id="cv-preview-panel" role="tabpanel" class="my-3">
      <button uiButton type="button" [disabled]="previewing()" (click)="preview()">
        <svg [lucideIcon]="downloadIcon" class="size-4" aria-hidden="true"></svg>
        {{ previewing() ? 'Generating...' : 'Download preview' }}
      </button>
    </div>
  </section>
</div>
