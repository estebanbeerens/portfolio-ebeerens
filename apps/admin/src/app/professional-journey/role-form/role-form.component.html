<ui-card
  class="w-full origin-top transition-all duration-300 ease-out xl:w-152 xl:shrink-0 starting:-translate-y-2 starting:opacity-0"
  [heading]="isEditing() ? 'Edit role' : 'New role'"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="text-text-muted text-xs"><span aria-hidden="true" class="text-error">*</span> Required field</p>

    <ui-input
      controlId="role-job-title"
      label="Job title"
      formControlName="jobTitle"
      [required]="true"
      [error]="fieldInvalid('jobTitle') ? 'Enter a job title.' : undefined"
    />

    <ui-select
      controlId="role-organization"
      label="Organization"
      formControlName="organizationId"
      [required]="true"
      [options]="organizationOptions()"
      placeholder="Select an organization"
      [error]="fieldInvalid('organizationId') ? 'Select an organization.' : undefined"
    />

    @if (showNewOrganizationField()) {
      <ui-input
        controlId="role-new-organization-name"
        label="New organization name"
        formControlName="newOrganizationName"
        [required]="true"
        [error]="fieldInvalid('newOrganizationName') ? 'Enter the organization name.' : undefined"
      />
    }

    <div>
      <label class="text-sm font-medium" for="role-description">Description</label>
      <p class="text-text-muted mt-1 text-xs">Markdown is supported (headings, bold, lists, links...).</p>
      <ui-language-tabs
        class="mt-1 block"
        label="Description language"
        panelId="role-description-panel"
        [(language)]="descriptionLanguage"
      />
      <div class="border-border flex gap-1 border-b" role="tablist" aria-label="Role description editor">
        <button
          type="button"
          role="tab"
          class="hover:bg-glass-hover focus-visible:outline-accent rounded-t px-3 py-2 text-xs font-semibold focus-visible:outline-2 focus-visible:outline-offset-2"
          [class.text-accent]="descriptionView() === 'markdown'"
          [class.border-accent]="descriptionView() === 'markdown'"
          [class.border-b-2]="descriptionView() === 'markdown'"
          [class.text-text-muted]="descriptionView() !== 'markdown'"
          [attr.aria-selected]="descriptionView() === 'markdown'"
          aria-controls="role-description-panel"
          (click)="descriptionView.set('markdown')"
        >
          Markdown
        </button>
        <button
          type="button"
          role="tab"
          class="hover:bg-glass-hover focus-visible:outline-accent rounded-t px-3 py-2 text-xs font-semibold focus-visible:outline-2 focus-visible:outline-offset-2"
          [class.text-accent]="descriptionView() === 'preview'"
          [class.border-accent]="descriptionView() === 'preview'"
          [class.border-b-2]="descriptionView() === 'preview'"
          [class.text-text-muted]="descriptionView() !== 'preview'"
          [attr.aria-selected]="descriptionView() === 'preview'"
          aria-controls="role-description-panel"
          (click)="descriptionView.set('preview')"
        >
          Preview
        </button>
      </div>
      <div id="role-description-panel" role="tabpanel">
        @if (descriptionView() === 'markdown') {
          <textarea
            id="role-description"
            class="border-border bg-surface focus-visible:outline-accent min-h-40 w-full rounded-b border border-t-0 px-3 py-2 font-mono text-sm focus-visible:outline-2 focus-visible:outline-offset-2"
            [formControl]="activeDescriptionControl()"
          ></textarea>
        } @else {
          <div class="border-border bg-surface-raised min-h-40 overflow-auto rounded-b border border-t-0 p-3">
            <ui-markdown [source]="activeDescriptionControl().value" />
          </div>
        }
      </div>
    </div>

    <ui-input controlId="role-location" label="Location" formControlName="location" />

    <ui-select
      controlId="role-employment-type"
      label="Employment type"
      formControlName="employmentType"
      [options]="employmentTypeOptions"
      placeholder="No employment type"
    />

    <div class="flex flex-col gap-4">
      <ui-input
        controlId="role-start-date"
        label="Start date"
        type="date"
        formControlName="startDate"
        [required]="true"
        [error]="fieldInvalid('startDate') ? 'Enter a start date.' : undefined"
      />
      <ui-input
        controlId="role-end-date"
        label="End date"
        type="date"
        formControlName="endDate"
        hint="Leave blank if this role is still current."
      />
    </div>

    <div>
      <ui-tag-combobox
        formControlName="skills"
        label="Skills"
        placeholder="Select or add a skill..."
        [options]="skillOptions()"
      />
      <p class="text-text-muted mt-1 text-xs">Pick an existing skill or type a new one and press Enter.</p>
    </div>

    @if (formError(); as error) {
      <p class="text-error text-xs" role="alert">{{ error }}</p>
    }
    <div class="flex justify-end gap-2">
      <button uiButton variant="outlined" type="button" (click)="cancelled.emit()">Cancel</button>
      <button uiButton type="submit" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save role' }}
      </button>
    </div>
  </form>
</ui-card>
