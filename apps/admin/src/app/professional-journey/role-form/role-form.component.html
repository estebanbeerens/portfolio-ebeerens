<ui-card
  class="w-full origin-top transition-all duration-300 ease-out xl:w-152 xl:shrink-0 starting:-translate-y-2 starting:opacity-0"
  [heading]="isEditing() ? 'Edit role' : 'New role'"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="text-text-muted text-xs"><span aria-hidden="true" class="text-error">*</span> Required field</p>

    <ui-input
      controlId="role-job-title"
      label="Job title"
      formControlName="jobTitle"
      [required]="true"
      [error]="fieldInvalid('jobTitle') ? 'Enter a job title.' : undefined"
    />

    <ui-select
      controlId="role-organization"
      label="Organization"
      formControlName="organizationId"
      [required]="true"
      [options]="organizationOptions()"
      placeholder="Select an organization"
      [error]="fieldInvalid('organizationId') ? 'Select an organization.' : undefined"
    />

    @if (showNewOrganizationField()) {
      <ui-input
        controlId="role-new-organization-name"
        label="New organization name"
        formControlName="newOrganizationName"
        [required]="true"
        [error]="fieldInvalid('newOrganizationName') ? 'Enter the organization name.' : undefined"
      />
    }

    <ui-input controlId="role-location" label="Location" formControlName="location" />

    <ui-select
      controlId="role-employment-type"
      label="Employment type"
      formControlName="employmentType"
      [options]="employmentTypeOptions"
      placeholder="No employment type"
    />

    <div class="flex flex-col gap-4">
      <ui-input
        controlId="role-start-date"
        label="Start date"
        type="date"
        formControlName="startDate"
        [required]="true"
        [error]="fieldInvalid('startDate') ? 'Enter a start date.' : undefined"
      />
      <ui-input
        controlId="role-end-date"
        label="End date"
        type="date"
        formControlName="endDate"
        hint="Leave blank if this role is still current."
      />
    </div>

    <div>
      <ui-tag-combobox
        formControlName="skills"
        label="Skills"
        placeholder="Select or add a skill..."
        [options]="skillOptions()"
      />
      <p class="text-text-muted mt-1 text-xs">Pick an existing skill or type a new one and press Enter.</p>
    </div>

    @if (formError(); as error) {
      <p class="text-error text-xs" role="alert">{{ error }}</p>
    }
    <div class="flex justify-end gap-2">
      <button uiButton variant="outlined" type="button" (click)="cancelled.emit()">Cancel</button>
      <button uiButton type="submit" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save role' }}
      </button>
    </div>
  </form>
</ui-card>
