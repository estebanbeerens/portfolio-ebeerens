<ui-page-header title="Feature Flags" subtitle="Toggle which sections of the public site are visible." />

<ui-card class="min-w-0 flex-1" heading="Flags">
  @if (flags.isLoading()) {
    <p class="text-text-muted" aria-live="polite">Loading feature flags...</p>
  } @else if (requestError(); as message) {
    <div class="border-error/40 bg-error/10 rounded border p-4" role="alert">
      <p>{{ message }}</p>
      <button type="button" class="text-accent mt-3 underline" (click)="retry()">Try again</button>
    </div>
  } @else {
    <div class="flex flex-col gap-3" aria-label="Feature flags">
      @for (flag of flagList(); track flag.key) {
        <div
          class="border-border hover:bg-glass-hover active:bg-glass-active relative flex cursor-pointer items-center justify-between gap-4 rounded border p-4 transition-colors"
        >
          <div class="min-w-0">
            <h2 class="font-semibold">{{ flagLabels[flag.key] }}</h2>
            <p class="text-text-muted mt-1 text-sm">Last updated {{ flag.updatedAt | date: 'medium' }}</p>
          </div>
          <ui-toggle
            [checked]="flag.enabled"
            [disabled]="pendingKey() === flag.key"
            [label]="flagLabels[flag.key] + ' feature flag'"
            [stretched]="true"
            (toggled)="onToggle(flag)"
          />
        </div>
      }
    </div>
  }
</ui-card>
