<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login | Portfolio Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="theme-color" content="#111827" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="logo-light.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Set the theme class before first paint/hydration to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.getElementById('app-favicon').href = isDark ? 'logo-dark.svg' : 'logo-light.svg';
        } catch (e) {
          // localStorage may be unavailable (e.g. private browsing); default to light.
        }
      })();
    </script>
  </head>
  <body>
    <admin-root></admin-root>
  </body>
</html>
