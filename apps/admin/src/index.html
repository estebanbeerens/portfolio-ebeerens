<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Set the theme class before first paint/hydration to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          // localStorage may be unavailable (e.g. private browsing); default to light.
        }
      })();
    </script>
  </head>
  <body>
    <admin-root></admin-root>
  </body>
</html>
