services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off: `docker compose run --rm migrate` before (re)starting api. Not part of `up`.
  migrate:
    image: ghcr.io/estebanbeerens/portfolio-ebeerens/api:${IMAGE_TAG:?set IMAGE_TAG to the target git SHA}-migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    container_name: portfolio-migrate
    profiles: ['migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/estebanbeerens/portfolio-ebeerens/api:${IMAGE_TAG:?set IMAGE_TAG to the target git SHA}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      ADMIN_GITHUB_ID: ${ADMIN_GITHUB_ID}
      ADMIN_APP_URL: ${ADMIN_APP_URL}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_DOCUMENTS_BUCKET: ${R2_DOCUMENTS_BUCKET}
      R2_IMAGES_BUCKET: ${R2_IMAGES_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      R2_JURISDICTION: ${R2_JURISDICTION}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/estebanbeerens/portfolio-ebeerens/web:${IMAGE_TAG:?set IMAGE_TAG to the target git SHA}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # SSR requests resolve this at runtime via Docker's internal DNS (compose service name).
      API_URL: http://api:3000
    depends_on:
      - api

  admin:
    image: ghcr.io/estebanbeerens/portfolio-ebeerens/admin:${IMAGE_TAG:?set IMAGE_TAG to the target git SHA}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: portfolio-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      - api
    # admin stays client-rendered (see build guide Stage 6) — no API_URL needed server-side.

  # only nginx is published to the host; api/web/admin stay on the internal compose network.
  # HTTP-only for now (Stage 10) — Stage 11 adds `443:443` + a `./nginx/certs` mount once the
  # Cloudflare Origin CA cert exists.
  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    # nginx.conf is git-tracked, so its single-file bind mount is always a real file. But
    # cloudflare-real-ip.conf is gitignored/generated and can be briefly absent, and a single-file
    # bind mount of a missing source makes Docker create a root-owned *directory* there, which then
    # fails every later start ("not a directory"). So mount the always-present ./nginx *directory*
    # for it (a dir mount can't trigger that) and include it from /etc/nginx/portfolio below.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/portfolio:ro
    depends_on:
      - api
      - web
      - admin
