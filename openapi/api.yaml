info:
  title: Portfolio API
  description: API documentation for the portfolio backend
  version: 0.0.1
  contact: {}
tags: []
servers: []
components:
  schemas:
    MeResponseDto:
      type: object
      properties:
        githubUserId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
      required:
        - githubUserId
        - displayName
    ProfileDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the profile
          example: cly1x8f9z0000abcd1234efgh
        name:
          type: string
          description: Full name shown on the portfolio
