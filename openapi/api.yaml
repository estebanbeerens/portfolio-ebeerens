info:
  title: Portfolio API
  description: API documentation for the portfolio backend
  version: 0.0.1
  contact: {}
tags: []
servers: []
components:
  schemas:
    MeResponseDto:
      type: object
      properties:
        githubUserId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
      required:
        - githubUserId
        - displayName
    ProfileDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the profile
          example: cly1x8f9z0000abcd1234efgh
        name:
          type: string
          description: Full name shown on the portfolio
          example: Jane Doe
        headline:
          type: string
          description: Short professional headline
          example: Full-stack developer
        bio:
          type: string
          description: Longer biography text
        avatarUrl:
          type: string
          description: URL of the profile avatar image
          example: https://cdn.example.com/avatar.png
        updatedAt:
          format: date-time
          type: string
          description: Timestamp of the last update
          example: '2026-08-14T12:00:00.000Z'
      required:
        - id
        - name
        - updatedAt
    UpdateProfileDto:
      type: object
      properties:
        name:
          type: string
          description: Full name shown on the portfolio
          example: Jane Doe
        headline:
          type: string
          description: Short professional headline
          example: Full-stack developer
        bio:
          type: string
          description: Longer biography text
        avatarUrl:
          type: string
          description: URL of the profile avatar image
          example: https://cdn.example.com/avatar.png
      required:
        - name
    SkillDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the skill
          example: cly1x8f9z0000abcd1234efgh
        name:
          type: string
          example: Angular
      required:
        - id
        - name
    ProjectDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the project
          example: cly1x8f9z0000abcd1234efgh
        title:
          type: string
          example: Personal Portfolio
        slug:
          type: string
          description: URL-safe unique identifier
          example: personal-portfolio
        description:
          type: object
          description: >-
            ProseMirror JSON document — see the image-storage-r2 skill for how
            this is produced/rendered
          example:
            type: doc
            content: []
        imageUrl:
          type: string
          example: https://cdn.example.com/projects/portfolio.png
        client:
          type: string
          example: Acme Corp
        jobRole:
          type: string
          example: Lead Frontend Engineer
        liveUrl:
          type: string
          example: https://portfolio.example.com
        startDate:
          format: date-time
          type: string
          description: When work on the project started
          example: '2024-01-15T00:00:00.000Z'
        endDate:
          format: date-time
          type: string
          description: When work on the project ended — absent means still ongoing
          example: '2024-06-30T00:00:00.000Z'
        skills:
          description: Skills used on this project
          type: array
          items:
            $ref: '#/components/schemas/SkillDto'
        createdAt:
          format: date-time
          type: string
          example: '2026-08-14T12:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          example: '2026-08-14T12:00:00.000Z'
      required:
        - id
        - title
        - slug
        - description
        - startDate
        - skills
        - createdAt
        - updatedAt
    CreateProjectDto:
      type: object
      properties:
        title:
          type: string
          example: Personal Portfolio
        slug:
          type: string
          description: URL-safe unique identifier
          example: personal-portfolio
        description:
          type: object
          description: >-
            ProseMirror JSON document — see the image-storage-r2 skill for how
            this is produced/rendered
        imageUrl:
          type: string
          example: https://cdn.example.com/projects/portfolio.png
        client:
          type: string
          example: Acme Corp
        jobRole:
          type: string
          example: Lead Frontend Engineer
        liveUrl:
          type: string
          example: https://portfolio.example.com
        startDate:
          type: string
          description: When work on the project started
          example: '2024-01-15'
        endDate:
          type: string
          description: When work on the project ended — omit if still ongoing
          example: '2024-06-30'
        skills:
          description: >-
            Skill names used on this project (e.g. React, Angular, .NET, Figma)
            — created if they do not already exist
          example: &ref_8
            - Angular
            - NestJS
            - Figma
          type: array
          items:
            type: string
      required:
        - title
        - slug
        - description
        - startDate
    UpdateProjectDto:
      type: object
      properties:
        title:
          type: string
          example: Personal Portfolio
        slug:
          type: string
          description: URL-safe unique identifier
          example: personal-portfolio
        description:
          type: object
          description: >-
            ProseMirror JSON document — see the image-storage-r2 skill for how
            this is produced/rendered
        imageUrl:
          type: string
          example: https://cdn.example.com/projects/portfolio.png
        client:
          type: string
          example: Acme Corp
        jobRole:
          type: string
          example: Lead Frontend Engineer
        liveUrl:
          type: string
          example: https://portfolio.example.com
        startDate:
          type: string
          description: When work on the project started
          example: '2024-01-15'
        endDate:
          type: string
          description: When work on the project ended — omit if still ongoing
          example: '2024-06-30'
        skills:
          description: >-
            Skill names used on this project (e.g. React, Angular, .NET, Figma)
            — created if they do not already exist
          example: *ref_8
          type: array
          items:
            type: string
    OrganizationDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the organization
          example: cly1x8f9z0000abcd1234efgh
        name:
          type: string
          example: Acme Corp
        logoUrl:
          type: string
          example: https://cdn.example.com/logos/acme.png
        website:
          type: string
          example: https://acme.example.com
        createdAt:
          format: date-time
          type: string
          example: '2026-08-17T12:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          example: '2026-08-17T12:00:00.000Z'
      required:
        - id
        - name
        - createdAt
        - updatedAt
    CreateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Corp
        logoUrl:
          type: string
          example: https://cdn.example.com/logos/acme.png
        website:
          type: string
          example: https://acme.example.com
      required:
        - name
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Corp
        logoUrl:
          type: string
          example: https://cdn.example.com/logos/acme.png
        website:
          type: string
          example: https://acme.example.com
    RoleDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the role
          example: cly1x8f9z0000abcd1234efgh
        jobTitle:
          type: string
          example: Senior Frontend Engineer
        organization:
          description: The organization this role was held at
          allOf:
            - $ref: '#/components/schemas/OrganizationDto'
        location:
          type: string
          example: Amsterdam, Netherlands
        employmentType:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - SELF_EMPLOYED
            - FREELANCE
            - INTERNSHIP
            - TRAINEE
            - APPRENTICESHIP
            - SEASONAL
          example: FULL_TIME
        startDate:
          format: date-time
          type: string
          description: When this role started
          example: '2024-01-15T00:00:00.000Z'
        endDate:
          format: date-time
          type: string
          description: When this role ended — absent means still current
          example: '2024-06-30T00:00:00.000Z'
        skills:
          description: Skills used in this role
          type: array
          items:
            $ref: '#/components/schemas/SkillDto'
        createdAt:
          format: date-time
          type: string
          example: '2026-08-17T12:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          example: '2026-08-17T12:00:00.000Z'
      required:
        - id
        - jobTitle
        - organization
        - startDate
        - skills
        - createdAt
        - updatedAt
    CreateRoleDto:
      type: object
      properties:
        jobTitle:
          type: string
          example: Senior Frontend Engineer
        organizationId:
          type: string
          description: Id of the organization this role was held at
          example: cly1x8f9z0000abcd1234efgh
        location:
          type: string
          example: Amsterdam, Netherlands
        employmentType:
          type: string
          enum: &ref_9
            - FULL_TIME
            - PART_TIME
            - SELF_EMPLOYED
            - FREELANCE
            - INTERNSHIP
            - TRAINEE
            - APPRENTICESHIP
            - SEASONAL
          example: FULL_TIME
        startDate:
          type: string
          description: When this role started
          example: '2024-01-15'
        endDate:
          type: string
          description: When this role ended — omit if still current
          example: '2024-06-30'
        skills:
          description: >-
            Skill names used in this role (e.g. React, Angular, .NET, Figma) —
            created if they do not already exist
          example: &ref_10
            - Angular
            - NestJS
            - Figma
          type: array
          items:
            type: string
      required:
        - jobTitle
        - organizationId
        - startDate
    UpdateRoleDto:
      type: object
      properties:
        jobTitle:
          type: string
          example: Senior Frontend Engineer
        organizationId:
          type: string
          description: Id of the organization this role was held at
          example: cly1x8f9z0000abcd1234efgh
        location:
          type: string
          example: Amsterdam, Netherlands
        employmentType:
          type: string
          enum: *ref_9
          example: FULL_TIME
        startDate:
          type: string
          description: When this role started
          example: '2024-01-15'
        endDate:
          type: string
          description: When this role ended — omit if still current
          example: '2024-06-30'
        skills:
          description: >-
            Skill names used in this role (e.g. React, Angular, .NET, Figma) —
            created if they do not already exist
          example: *ref_10
          type: array
          items:
            type: string
    FeatureFlagDto:
      type: object
      properties:
        key:
          type: string
          enum:
            - CONTACT
            - PROJECTS
            - ROLES
            - SKILLS
          example: PROJECTS
        enabled:
          type: boolean
          example: false
        updatedAt:
          format: date-time
          type: string
          example: '2026-08-17T12:00:00.000Z'
      required:
        - key
        - enabled
        - updatedAt
    UpdateFeatureFlagDto:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
      required:
        - enabled
    CreateContactMessageDto:
      type: object
      properties:
        fullName:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane.doe@example.com
        organization:
          type: string
          example: Acme Inc.
        subject:
          type: string
          example: Freelance project inquiry
        message:
          type: string
          example: Hi, I'd like to discuss a project with you.
        recaptchaToken:
          type: string
          description: Token produced by the reCAPTCHA widget on the contact form
      required:
        - fullName
        - email
        - subject
        - message
        - recaptchaToken
    ContactMessageDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the message
          example: cly1x8f9z0000abcd1234efgh
        fullName:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane.doe@example.com
